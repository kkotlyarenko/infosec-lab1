name: CI / Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    name: Build, test & security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp clean test

      # SAST: статический анализ кода (SpotBugs)
      - name: SAST - SpotBugs
        run: mvn -B -ntp spotbugs:check

      - name: Set up Node.js for Snyk CLI
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Snyk CLI
        run: npm install -g snyk

      # SCA: проверка зависимостей на известные уязвимости (Snyk)
      - name: SCA - Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test --all-projects --severity-threshold=high
          --json-file-output=target/snyk-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/snyk-report.json
            target/surefire-reports/
          if-no-files-found: warn
