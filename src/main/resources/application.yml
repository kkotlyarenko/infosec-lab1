server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: microblog-api
  datasource:
    url: jdbc:h2:file:./data/appdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    # Веб-консоль БД отключена, чтобы не открывать лишнюю поверхность атаки.
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null

security:
  jwt:
    # В production секрет задаётся переменной окружения JWT_SECRET.
    secret: ${JWT_SECRET:dev-secret-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
